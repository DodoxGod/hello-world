name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: filo-mod
          path: build/libs/*.jar
      - name: Game tests (servidor real de Minecraft)
        run: |
          ./gradlew runGametest > gametest.log 2>&1 || { grep -E "GameTestException|required tests|filogametests|ERROR" gametest.log; exit 1; }
          grep -E "tests? (passed|failed)|All .* tests" gametest.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-report
          path: build/gametest/
