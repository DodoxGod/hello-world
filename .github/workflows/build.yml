name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: filo-mod
          path: build/libs/*.jar
      - name: Game tests (servidor real de Minecraft)
        run: |
          ./gradlew runGametest > gametest.log 2>&1 || { grep -E "GameTestException|required tests|filogametests|ERROR" gametest.log; grep -o '<failure[^>]*>' build/gametest/junit.xml; exit 1; }
          grep -E "tests? (passed|failed)|All .* tests" gametest.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-report
          path: build/gametest/

  forja:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Forja
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace > build.log 2>&1 || { grep -E ": error:" -A 3 build.log | head -150; grep -E "What went wrong" -A 6 build.log | head -20; exit 1; }
          tail -5 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: forja-mod
          path: forja/build/libs/*.jar
      - name: Game tests de Forja (servidor real de Minecraft 26.2)
        run: |
          TASK=$(./gradlew tasks --all -q 2>/dev/null | grep -oiE "^run(Game|Server)?Game?[Tt]est[A-Za-z]*" | grep -iv client | head -1)
          echo "Tarea: ${TASK:-runGameTest}"
          ./gradlew ${TASK:-runGameTest} > gametest.log 2>&1 || { grep -E "GameTestAssert|assert|required tests|tests failed|combatgametests|ERROR|Exception|error:" gametest.log | grep -v "^\s*at " | head -60; exit 1; }
          grep -iE "tests? (passed|failed)|All .* tests|required tests" gametest.log || tail -20 gametest.log
